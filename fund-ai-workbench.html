<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>基金 AI 工作台</title>
  <link rel="stylesheet" href="workbench.css">
  <link rel="stylesheet" href="strategy-invest.css">
  <script src="workbench.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#holdings"><span class="brand-mark">↗</span><span>基金 AI 工作台<small>研究有依据，执行有记录</small></span></a>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主导航">
        <button class="nav" data-route="home"><span class="nav-icon">✦</span>问 AI</button>
        <button class="nav" data-route="holdings"><span class="nav-icon">▤</span>我的持仓<span class="nav-count" id="holding-count">—</span></button>
        <button class="nav" data-route="trades"><span class="nav-icon">⇄</span>订单中心</button>
        <button class="nav" data-route="watchlist"><span class="nav-icon">☆</span>自选基金</button>
        <div class="nav-label">策略研究</div>
        <button class="nav" data-route="strategy-invest"><span class="nav-icon">◈</span>策略投资<span class="nav-count" id="strategy-invest-count">5</span></button>
        <button class="nav" data-route="library"><span class="nav-icon">▦</span>策略中心</button>
        <button class="nav" data-route="strategies"><span class="nav-icon">◫</span>我的策略<span class="nav-count" id="strategy-count">0</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card"><div><span class="dot" id="fund-dot"></span>同花顺爱基金</div><small id="fund-connection">正在检测账户连接</small><small id="sync-status">尚未同步账户</small><button data-route="settings"><span id="ai-top-status">管理数据与模型</span><span>↗</span></button></div>
        <button class="sidebar-agent desktop-only" id="agent-toggle" type="button"><span>✦</span><span>打开基金 Agent<small>当前页面继续对话</small></span></button>
        <button class="nav settings-nav" data-route="settings"><span class="nav-icon">⚙</span>接入设置<span id="ai-side-status">—</span></button>
        <div class="local-label"><span class="tiny-lock">▣</span> 本机工作空间</div>
      </div>
    </aside>
    <div class="main">
      <main id="content" tabindex="-1"><div class="loading"><span class="spinner"></span>正在读取工作空间…</div></main>
      <footer class="app-footer"><span>本地计划 · 真实账户数据</span><span>持仓与订单以同花顺爱基金返回结果为准</span></footer>
    </div>
  </div>
  <aside id="agent-panel" class="agent-panel" aria-label="Codex 基金 Agent" hidden>
    <div id="agent-shell" class="agent-shell">
    <div class="agent-head"><div><strong>✦ 基金 Agent</strong><small id="agent-provider">正在连接 Codex</small></div><div class="agent-head-actions"><button id="agent-new" title="新建会话" type="button">＋</button><button id="agent-close" title="收起" type="button">×</button></div></div>
    <div class="agent-session-bar"><button id="agent-session-button" type="button">选择会话</button><button id="agent-archive" type="button" title="归档当前会话">归档</button></div>
    <div id="agent-sessions" class="agent-sessions" hidden></div>
    <div id="agent-status" class="agent-status">正在启动 Agent…</div>
    <div id="agent-messages" class="agent-messages" aria-live="polite"></div>
    <div id="agent-question" class="agent-question" hidden></div>
    <form id="agent-form" class="agent-composer">
      <textarea id="agent-input" maxlength="12000" placeholder="例如：分析我的持仓集中度，并说明依据。"></textarea>
      <label class="agent-consent"><input id="agent-data-consent" type="checkbox">允许当前模型服务在本会话调用账户查询工具</label>
      <div><span id="agent-run-state">就绪</span><button id="agent-stop" class="button subtle small" type="button" hidden>停止</button><button id="agent-send" class="button primary small">发送 ↑</button></div>
    </form>
    </div>
  </aside>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
