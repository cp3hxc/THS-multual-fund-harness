<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SUVI · 你的基金投资助手</title>
  <link rel="stylesheet" href="panda-strategy-agent.css">
  <link rel="stylesheet" href="panda-strategy-agent-fixes.css">
  <link rel="stylesheet" href="suvi.css">
  <link rel="stylesheet" href="market-studio.css">
  <script src="panda-strategy-agent.js" defer></script>
  <script src="market-studio.js" defer></script>
</head>
<body>
  <div class="suvi-window-strip" aria-hidden="true"><span class="suvi-window-dot">✦</span><span>SUVI</span><i></i><span class="suvi-window-subtitle">你的基金投资助手</span></div>
  <div class="panda-app">
    <aside class="panda-sidebar">
      <div class="panda-brand"><div><strong class="ths-finance-brand">同花顺<span>理财</span></strong><small>SUVI · 你的基金投资助手</small></div></div>
      <button class="panda-workbench-nav active" data-nav="workbench" type="button"><span class="nav-symbol">▣</span>对话工作台</button>
      <button class="panda-new" id="agent-new" type="button"><span>＋</span>新增会话</button>
      <div id="panda-sessions" class="panda-session-list"><span>桌面版启动后显示会话</span></div>
      <div class="panda-section-label workspace-label">基金工作区</div>
      <nav class="panda-nav panda-workspace-nav" aria-label="SUVI 基金工作区">
        <button type="button" data-nav="workbench" class="suvi-mobile-workbench"><span class="nav-symbol">✦</span><span>对话</span></button>
        <button type="button" data-nav="market"><span class="nav-symbol">⌁</span><span>看行情</span></button>
        <button type="button" data-nav="funds"><span class="nav-symbol">⌕</span><span>找基金</span></button>
        <button type="button" data-nav="library"><span class="nav-symbol">◈</span><span>找策略</span></button>
        <button type="button" data-nav="allocation"><span class="nav-symbol">◫</span><span>配资产</span></button>
        <button type="button" data-nav="holdings"><span class="nav-symbol">▤</span><span>看持仓</span></button>
        <button type="button" data-nav="custom"><span class="nav-symbol">▦</span><span>我的页面</span></button>
      </nav>
      <div class="panda-sidebar-bottom">
        <button class="panda-quiet" data-nav="account"><span class="nav-symbol">◎</span>账户与连接</button>
        <div class="panda-credit"><span>模型服务</span><strong id="panda-model-status">正在连接</strong></div>
        <button class="panda-quiet" data-nav="settings">模型与推理设置</button>
        <div class="panda-data-note"><i></i><span>SUVI 在工作<small>交易决定与确认由你完成</small></span></div>
      </div>
    </aside>
    <main class="panda-main">
      <header class="panda-topbar"><div class="panda-top-actions"><span id="panda-data-status">正在连接本地数据</span><button class="suvi-ask-button" data-action="toggle-agent" type="button" aria-expanded="false">✦ 问 SUVI</button><button class="icon-button" data-nav="settings" aria-label="设置">⚙</button></div></header>
      <section id="panda-content" class="panda-content" aria-live="polite"></section>
    </main>
  </div>
  <aside id="agent-panel" class="panda-agent-panel" aria-label="SUVI 投资助手" hidden>
    <div id="agent-shell" class="panda-agent-shell">
      <div class="panda-agent-head"><div><strong><span class="suvi-agent-mark">✦</span> SUVI</strong><small id="agent-provider">正在连接模型</small></div><div><button id="agent-rename" title="重命名会话" type="button">重命名</button><button id="agent-pin" title="置顶会话" type="button">☆</button><button id="agent-archive" title="归档会话" type="button">归档</button><button id="agent-delete" title="删除会话" type="button">删除</button><button class="suvi-close-agent" data-action="close-agent" title="关闭协作窗口" type="button">×</button></div></div>
      <div id="agent-status" class="panda-agent-status">正在启动 Agent…</div>
      <div id="agent-messages" class="panda-agent-messages" aria-live="polite"></div>
      <button id="agent-jump-latest" class="suvi-jump-latest" type="button" data-chat-action="latest" hidden>↓ 回到最新回复</button>
      <div id="agent-question" class="panda-agent-question" hidden></div>
      <form id="agent-form" class="panda-agent-composer">
        <div id="agent-context" class="suvi-composer-context"></div>
        <textarea id="agent-input" rows="1" maxlength="12000" placeholder="告诉 SUVI 你的目标、预算或担心的问题…" aria-label="给 SUVI 发送消息"></textarea>
        <div class="panda-agent-controls"><label><input id="agent-data-consent" type="checkbox">账户权限：只读查询</label><button class="panda-agent-setting" type="button" data-nav="settings">模型 / 推理</button><span id="agent-run-state">就绪</span><button id="agent-stop" class="panda-button quiet" type="button" hidden>停止</button><button id="agent-send" class="panda-button primary" type="submit" disabled>发送 ↑</button></div>
        <div class="agent-composer-hint"><span id="agent-model-label"></span><span>回车换行 · Ctrl / ⌘ + 回车发送</span></div>
      </form>
    </div>
  </aside>
  <dialog id="panda-dialog"><div id="panda-dialog-content"></div></dialog>
</body>
</html>
