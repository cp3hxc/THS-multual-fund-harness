<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>场外基金 Agent · 四种交互原型</title>
  <link rel="stylesheet" href="fund-agent-showcase.css">
  <script src="fund-agent-showcase.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="menu-button mobile-only" data-action="toggle-sidebar" aria-label="打开功能栏">☰</button>
      <div class="workspace-breadcrumb"><span>基金 AI 工作台</span><i>/</i><strong>官方功能原型</strong></div>
      <div class="top-context" id="top-context"></div>
      <div class="top-actions">
        <span class="demo-badge"><i></i>演示数据</span>
        <button class="text-button" data-action="reset-demo">重置演示</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Agent 功能">
        <button class="workbench-brand" data-action="new-task" aria-label="返回原型首页">
          <span class="brand-mark">↗</span>
          <span><strong>基金 AI 工作台</strong><small>研究有依据，执行有记录</small></span>
        </button>
        <div class="sidebar-scroll" id="sidebar-content"></div>
      </aside>
      <button class="sidebar-scrim" data-action="toggle-sidebar" aria-label="关闭功能栏"></button>

      <main class="workspace" id="workspace" tabindex="-1">
        <div class="workspace-scroll" id="workspace-content"></div>
        <form class="composer" id="composer-form">
          <div class="composer-inner">
            <textarea id="composer-input" rows="1" maxlength="500" placeholder="直接问：这只基金还要继续投吗？"></textarea>
            <div class="composer-foot">
              <span>可以提问，也可以调整当前方案</span>
              <button class="send-button" type="submit" aria-label="发送问题">发送 ↑</button>
            </div>
          </div>
        </form>
      </main>
    </div>

    <dialog class="save-dialog" id="save-dialog" aria-labelledby="save-title">
      <form id="save-form" method="dialog">
        <div class="dialog-head">
          <div><span class="eyebrow">保存本次做法</span><h2 id="save-title">保存为我的功能</h2></div>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <div class="dialog-body">
          <label for="save-name">功能名称</label>
          <input id="save-name" name="name" maxlength="32" required>
          <div class="save-preview" id="save-preview"></div>
        </div>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel">取消</button>
          <button class="primary-button" value="default">保存功能</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
